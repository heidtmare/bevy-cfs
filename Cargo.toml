[workspace]
resolver = "3"
members = [
    "crates/bevy_cfs",
    "crates/ccsds",
    "crates/cfs-msg",
    "crates/cfs-link",
    "crates/telemetry-model",
    "crates/telemetry-anim",
    "tools/fake-cfs",
    "tools/tlm-capture",
    "tools/gltf-gen",
    "spikes/anim-mappings",
]
# NOTE: only spikes/anim-mappings pulls a renderer. Everything else builds and
# tests without a GPU, which is what keeps `cargo test --workspace` usable in CI.
# apps/viz joins in Phase 4.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
# Path deps declare default-features = false so that no_std members can use them
# as-is; std consumers opt in with features = ["std"].
ccsds = { path = "crates/ccsds", default-features = false }
cfs-msg = { path = "crates/cfs-msg", default-features = false }
cfs-link = { path = "crates/cfs-link" }
telemetry-model = { path = "crates/telemetry-model", default-features = false }
telemetry-anim = { path = "crates/telemetry-anim", default-features = false }
bevy_cfs = { path = "crates/bevy_cfs" }
