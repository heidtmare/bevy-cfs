services:
  cfs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # TODO(phase-0): pin to a release tag, not `main`.
        CFS_REF: main
    # cFS is built for x86_64; on Apple Silicon this runs under emulation, which
    # is slow to build but fine to run at lab telemetry rates.
    platform: linux/amd64
    ports:
      # ci_lab command ingest. Telemetry is *outbound* from the container to
      # whatever address the enable-output command names, so it needs no mapping.
      - "1234:1234/udp"
    extra_hosts:
      # Lets anything inside the container address the host as
      # host.docker.internal, including to_lab's telemetry destination.
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
