[workspace]
# Deliberately its own workspace, not a member of the root one. Every other
# member builds and tests offline on the host (PLAN.md's "reproducible
# offline" discipline); this crate's build.rs requires CFS_SRC_DIR and
# CFS_BUILD_DIR pointing at a Linux checkout+build of the pinned cFS bundle
# (see build.rs), which only exist inside docker/Dockerfile's build stage.
# Folding it into `cargo build --workspace` would break that for everyone on
# a Mac or in CI. Build it explicitly, inside the container:
#   cargo build -p rust-cfs-app --manifest-path spikes/rust-cfs-app/Cargo.toml
#
# The `crates/*` path dependencies below reach back into the root workspace's
# source *without* joining it, which is the arrangement Architecture B was
# meant to test: the same no_std crates the ground software uses, compiled
# into flight software, with no second copy and no shared build.

[package]
name = "rust-cfs-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Phase 5 spike: a cFE ES application written in Rust, computing vehicle dynamics and publishing them on the software bus."

[lib]
# cFE's ES loader dlopen()s this like any C app .so. There is no Rust code on
# the other side of the FFI boundary, so no rlib/dylib metadata is needed.
crate-type = ["cdylib"]

[build-dependencies]
bindgen = "0.72"

[dependencies]
# no_std + libm, not the std default. The app links libc through cFE anyway, so
# `std` would build — but taking it would make this crate stop testing the
# thing it exists to test, namely that the reusable crates really are usable
# without a hosted runtime. libm is a pure-Rust soft-float library with no
# platform assumptions, which is the dependency a real flight target could keep.
ccsds = { path = "../../crates/ccsds", default-features = false }
cfs-msg = { path = "../../crates/cfs-msg", default-features = false }
telemetry-model = { path = "../../crates/telemetry-model", default-features = false, features = ["libm"] }
vehicle-dyn = { path = "../../crates/vehicle-dyn", default-features = false, features = ["libm"] }
